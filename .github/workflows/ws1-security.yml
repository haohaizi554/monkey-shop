name: WS1 Security Gate

on:
  push:
    branches:
      - main
      - 'codex/**'
      - '*Architecture-Upgrade'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXTERNAL_SECURITY_GATES_REQUIRED: ${{ vars.EXTERNAL_SECURITY_GATES_REQUIRED || 'false' }}

jobs:
  fast-security:
    name: Fast WS1 Security Gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install gate tools
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          python -m pip install --upgrade pip uv
          .\scripts\bootstrap-ws1-tools.ps1
          rg --version
          gitleaks version
          trivy --version
          uvx --version

      - name: Run fast WS1 security gate
        shell: pwsh
        run: .\scripts\verify-ws1-security.ps1 -SkipDependencyCheck -MavenTimeoutSeconds 1800

      - name: Upload WS1 reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ws1-security-fast-reports
          path: target/ws1-security/
          if-no-files-found: ignore

  dependency-check:
    name: Full OWASP Dependency Check
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Resolve OWASP dependency-check policy
        id: nvd-policy
        shell: pwsh
        run: |
          $available = -not [string]::IsNullOrWhiteSpace($env:NVD_API_KEY)
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($available) {
            return
          }
          if ($env:EXTERNAL_SECURITY_GATES_REQUIRED -eq "true") {
            throw "NVD_API_KEY is required when EXTERNAL_SECURITY_GATES_REQUIRED=true."
          }
          Write-Output "::notice title=OWASP dependency-check deferred::NVD_API_KEY is not configured; the Fast WS1 Security Gate remains blocking."
          @(
            "### OWASP dependency-check deferred"
            "NVD_API_KEY is not configured. Set EXTERNAL_SECURITY_GATES_REQUIRED=true to make this credential mandatory."
          ) >> $env:GITHUB_STEP_SUMMARY

      - name: Checkout source
        if: steps.nvd-policy.outputs.available == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Java
        if: steps.nvd-policy.outputs.available == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verify with OWASP dependency-check
        if: steps.nvd-policy.outputs.available == 'true'
        shell: pwsh
        run: mvn --batch-mode -DautoUpdate=true clean verify

      - name: Upload dependency-check reports
        if: always() && steps.nvd-policy.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-check-reports
          path: |
            target/dependency-check-report.*
            dependency-check-report.*
          if-no-files-found: ignore
