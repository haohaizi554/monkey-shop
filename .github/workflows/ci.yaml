name: CI/CD

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  REGISTRY_INPUT: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_INPUT: ${{ vars.CONTAINER_IMAGE || github.repository }}

jobs:
  backend:
    name: Maven Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Require OWASP NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "::error::NVD_API_KEY secret is required so OWASP dependency-check can run as a blocking CI gate."
            exit 1
          fi

      - name: Cache OWASP dependency-check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run Maven verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn --batch-mode clean verify

  frontend:
    name: Frontend Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit

      - name: API contract
        run: npm run test:api-contract

      - name: Format
        run: npm run format

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Export Chromium path for Lighthouse
        run: echo "CHROME_PATH=$(node -e \"const { chromium } = require('playwright'); console.log(chromium.executablePath())\")" >> "$GITHUB_ENV"

      - name: Lighthouse performance gate
        run: npm run test:lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report.json
          if-no-files-found: ignore

  devops:
    name: DevOps Manifest Verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Verify WS7 manifests
        shell: pwsh
        run: .\scripts\verify-ws7-devops.ps1 -RequireHelm -DownloadHelmIfMissing

      - name: Verify WS8 security posture
        shell: pwsh
        run: .\scripts\verify-ws8-security.ps1

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ws7-rendered-manifests
          path: target/ws7-devops/
          if-no-files-found: ignore

  image:
    name: Image Build Scan Sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - backend
      - frontend
      - devops
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          registry="${REGISTRY_INPUT}"
          image="${IMAGE_INPUT,,}"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "repository=${image}" >> "$GITHUB_OUTPUT"
          echo "uri=${registry}/${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ steps.image.outputs.uri }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build local image for scanning
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          load: true
          tags: monkeyshop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: monkeyshop:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: ignore

      - name: Upload Trivy to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ steps.image.outputs.registry == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ steps.image.outputs.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}

      - name: Push image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign pushed image digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_URI}@${IMAGE_DIGEST}"
