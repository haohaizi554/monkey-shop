name: CI/CD

on:
  push:
    branches:
      - main
      - 'codex/**'
      - '*Architecture-Upgrade'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

env:
  REGISTRY_INPUT: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_INPUT: ${{ vars.CONTAINER_IMAGE || github.repository }}
  EXTERNAL_SECURITY_GATES_REQUIRED: ${{ vars.EXTERNAL_SECURITY_GATES_REQUIRED || 'false' }}

jobs:
  backend:
    name: Maven Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve OWASP dependency-check policy
        id: nvd-policy
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "${NVD_API_KEY}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "available=false" >> "${GITHUB_OUTPUT}"
          if [ "${EXTERNAL_SECURITY_GATES_REQUIRED}" = "true" ]; then
            echo "::error::NVD_API_KEY is required when EXTERNAL_SECURITY_GATES_REQUIRED=true."
            exit 1
          fi
          echo "::notice title=OWASP dependency-check deferred::NVD_API_KEY is not configured; Maven Verify will skip the external NVD refresh while Fast WS1, Trivy, CodeQL, and npm audit remain blocking."
          {
            echo "### OWASP dependency-check deferred"
            echo "NVD_API_KEY is not configured. Set EXTERNAL_SECURITY_GATES_REQUIRED=true to make this credential mandatory."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cache OWASP dependency-check data
        if: steps.nvd-policy.outputs.available == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run Maven verify with OWASP dependency-check
        if: steps.nvd-policy.outputs.available == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          RUN_CART_REDIS_ACCEPTANCE: 'true'
          CART_REDIS_HOST: 127.0.0.1
          CART_REDIS_PORT: '6379'
        run: mvn --batch-mode -DautoUpdate=true clean verify

      - name: Run Maven verify with local security fallback
        if: steps.nvd-policy.outputs.available != 'true'
        env:
          RUN_CART_REDIS_ACCEPTANCE: 'true'
          CART_REDIS_HOST: 127.0.0.1
          CART_REDIS_PORT: '6379'
        run: mvn --batch-mode -DautoUpdate=false -Ddependency-check.skip=true clean verify

  frontend:
    name: Frontend Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit

      - name: API contract
        run: npm run test:api-contract

      - name: Format
        run: npm run format

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Export Chromium path for Lighthouse
        run: |
          chromium_path="$(node -p 'require("playwright").chromium.executablePath()')"
          printf 'CHROME_PATH=%s\n' "${chromium_path}" >> "${GITHUB_ENV}"

      - name: Lighthouse performance gate
        run: npm run test:lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report.json
          if-no-files-found: ignore

  devops:
    name: DevOps Manifest Verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify image downloader contract
        shell: pwsh
        run: .\scripts\tests\download-monkey-images.Tests.ps1

      - name: Verify WS7 manifests
        shell: pwsh
        run: .\scripts\verify-ws7-devops.ps1 -RequireHelm -DownloadHelmIfMissing

      - name: Verify Kyverno supply-chain policies
        shell: pwsh
        run: .\scripts\verify-kyverno-supply-chain.ps1

      - name: Verify WS6 observability posture
        shell: pwsh
        run: .\scripts\verify-ws6-observability.ps1

      - name: Verify WS8 security posture
        shell: pwsh
        run: .\scripts\verify-ws8-security.ps1

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ws7-rendered-manifests
          path: target/ws7-devops/
          if-no-files-found: ignore

  image:
    name: Image Build Scan Sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - backend
      - frontend
      - devops
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          registry="${REGISTRY_INPUT}"
          image="${IMAGE_INPUT,,}"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "repository=${image}" >> "$GITHUB_OUTPUT"
          echo "uri=${registry}/${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.image.outputs.uri }}
          tags: |
            type=ref,event=branch,prefix=branch-
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build local image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          load: true
          tags: monkeyshop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare runtime image report directory
        run: mkdir -p target/runtime-supply-chain

      - name: Trivy runtime image JSON gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: monkeyshop:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: target/runtime-supply-chain/trivy-runtime-image.json

      - name: Trivy image scan
        if: always()
        id: trivy-sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: monkeyshop:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true

      - name: Upload Trivy runtime image JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-runtime-image-json
          path: target/runtime-supply-chain/trivy-runtime-image.json
          if-no-files-found: ignore

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: ignore

      - name: Upload Trivy to code scanning
        if: always() && github.event_name != 'pull_request' && steps.trivy-sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7
        with:
          sarif_file: trivy-image.sarif

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ steps.image.outputs.registry == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ steps.image.outputs.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}

      - name: Push image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign pushed image digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_URI}@${IMAGE_DIGEST}"

      - name: Validate production release inputs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_REPOSITORY}" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+$ ]] || [[ "${IMAGE_REPOSITORY}" == *"@"* ]]; then
            echo "::error::Production image repository is missing or invalid."
            exit 1
          fi
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Production image digest must be a lowercase sha256 digest."
            exit 1
          fi
          if [[ "${IMAGE_DIGEST}" =~ ^sha256:0{64}$ ]]; then
            echo "::error::Production image digest must not be an all-zero placeholder."
            exit 1
          fi

      - name: Update production release manifests
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: production-release
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          values_file="helm/monkeyshop/values-prod.yaml"
          application_file="deploy/argocd/applications/monkeyshop-prod.yaml"

          if [[ "$(grep -Ec '^  repository:' "${values_file}")" -ne 1 ]] || [[ "$(grep -Ec '^  digest:' "${values_file}")" -ne 1 ]]; then
            echo "::error::Production values must contain exactly one image repository and digest field."
            exit 1
          fi

          sed -i -E "s#^  repository:.*#  repository: ${IMAGE_REPOSITORY}#" "${values_file}"
          sed -i -E "s#^  digest:.*#  digest: ${IMAGE_DIGEST}#" "${values_file}"
          grep -Fqx "  repository: ${IMAGE_REPOSITORY}" "${values_file}"
          grep -Fqx "  digest: ${IMAGE_DIGEST}" "${values_file}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- "${values_file}"; then
            git add "${values_file}"
            git commit -m "ci: publish production image ${IMAGE_DIGEST} [skip ci]"
          fi

          release_revision="$(git rev-parse HEAD)"
          if [[ ! "${release_revision}" =~ ^[0-9a-f]{40}$ ]] || [[ "${release_revision}" =~ ^0{40}$ ]]; then
            echo "::error::Production release revision must be a non-zero 40-character Git SHA."
            exit 1
          fi
          if [[ "$(grep -Ec '^[[:space:]]*targetRevision:' "${application_file}")" -ne 1 ]]; then
            echo "::error::Production Argo CD Application must contain exactly one targetRevision."
            exit 1
          fi

          sed -i -E "s#^([[:space:]]*targetRevision:).*#\1 ${release_revision}#" "${application_file}"
          grep -Eq "^[[:space:]]*targetRevision:[[:space:]]+${release_revision}$" "${application_file}"
          git show "${release_revision}:${values_file}" | grep -Fqx "  repository: ${IMAGE_REPOSITORY}"
          git show "${release_revision}:${values_file}" | grep -Fqx "  digest: ${IMAGE_DIGEST}"

          if ! git diff --quiet -- "${application_file}"; then
            git add "${application_file}"
            git commit -m "ci: pin production release ${release_revision} [skip ci]"
          fi

          echo "release_revision=${release_revision}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Production GitOps release"
            echo "- Repository: \`${IMAGE_REPOSITORY}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Revision: \`${release_revision}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          git push origin HEAD:main
