name: CI/CD

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  REGISTRY_INPUT: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_INPUT: ${{ vars.CONTAINER_IMAGE || github.repository }}

jobs:
  backend:
    name: Maven Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Require OWASP NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "::error::NVD_API_KEY secret is required so OWASP dependency-check can run as a blocking CI gate."
            exit 1
          fi

      - name: Cache OWASP dependency-check data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run Maven verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn --batch-mode -DautoUpdate=true clean verify

  frontend:
    name: Frontend Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit

      - name: API contract
        run: npm run test:api-contract

      - name: Format
        run: npm run format

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Export Chromium path for Lighthouse
        run: echo "CHROME_PATH=$(node -e \"const { chromium } = require('playwright'); console.log(chromium.executablePath())\")" >> "$GITHUB_ENV"

      - name: Lighthouse performance gate
        run: npm run test:lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report.json
          if-no-files-found: ignore

  devops:
    name: DevOps Manifest Verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify WS7 manifests
        shell: pwsh
        run: .\scripts\verify-ws7-devops.ps1 -RequireHelm -DownloadHelmIfMissing

      - name: Verify Kyverno supply-chain policies
        shell: pwsh
        run: .\scripts\verify-kyverno-supply-chain.ps1

      - name: Verify WS6 observability posture
        shell: pwsh
        run: .\scripts\verify-ws6-observability.ps1

      - name: Verify WS8 security posture
        shell: pwsh
        run: .\scripts\verify-ws8-security.ps1

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ws7-rendered-manifests
          path: target/ws7-devops/
          if-no-files-found: ignore

  image:
    name: Image Build Scan Sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - backend
      - frontend
      - devops
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          registry="${REGISTRY_INPUT}"
          image="${IMAGE_INPUT,,}"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "repository=${image}" >> "$GITHUB_OUTPUT"
          echo "uri=${registry}/${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ steps.image.outputs.uri }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build local image for scanning
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          load: true
          tags: monkeyshop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare runtime image report directory
        run: mkdir -p target/runtime-supply-chain

      - name: Trivy runtime image JSON gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: monkeyshop:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: target/runtime-supply-chain/trivy-runtime-image.json

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: monkeyshop:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy runtime image JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-runtime-image-json
          path: target/runtime-supply-chain/trivy-runtime-image.json
          if-no-files-found: ignore

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: ignore

      - name: Upload Trivy to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7
        with:
          sarif_file: trivy-image.sarif

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ steps.image.outputs.registry == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ steps.image.outputs.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}

      - name: Push image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign pushed image digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_URI}@${IMAGE_DIGEST}"
