name: Snyk Security Gate

on:
  push:
    branches:
      - main
      - 'codex/**'
      - '*Architecture-Upgrade'
  pull_request:
  schedule:
    - cron: '37 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require Snyk token
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "::error::SNYK_TOKEN secret is required so Snyk can run as a blocking CI gate."
            exit 1
          fi

      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Snyk Maven scan
        run: snyk test --file=pom.xml --package-manager=maven --severity-threshold=high

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Snyk frontend scan
        working-directory: frontend
        run: snyk test --file=package-lock.json --package-manager=npm --severity-threshold=high
