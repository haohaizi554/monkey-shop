name: Snyk Security Gate

on:
  push:
    branches:
      - main
      - 'codex/**'
      - '*Architecture-Upgrade'
  pull_request:
  schedule:
    - cron: '37 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      EXTERNAL_SECURITY_GATES_REQUIRED: ${{ vars.EXTERNAL_SECURITY_GATES_REQUIRED || 'false' }}
    steps:
      - name: Resolve Snyk policy
        id: snyk-policy
        run: |
          if [ -n "${SNYK_TOKEN}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "available=false" >> "${GITHUB_OUTPUT}"
          if [ "${EXTERNAL_SECURITY_GATES_REQUIRED}" = "true" ]; then
            echo "::error::SNYK_TOKEN is required when EXTERNAL_SECURITY_GATES_REQUIRED=true."
            exit 1
          fi
          echo "::notice title=Snyk gate deferred::SNYK_TOKEN is not configured; Fast WS1, Maven local checks, Trivy, CodeQL, and npm audit remain blocking."
          {
            echo "### Snyk gate deferred"
            echo "SNYK_TOKEN is not configured. Set EXTERNAL_SECURITY_GATES_REQUIRED=true to make this credential mandatory."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout source
        if: steps.snyk-policy.outputs.available == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Java
        if: steps.snyk-policy.outputs.available == 'true'
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        if: steps.snyk-policy.outputs.available == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Snyk CLI
        if: steps.snyk-policy.outputs.available == 'true'
        run: npm install --global snyk

      - name: Snyk Maven scan
        if: steps.snyk-policy.outputs.available == 'true'
        run: snyk test --file=pom.xml --package-manager=maven --severity-threshold=high

      - name: Install frontend dependencies
        if: steps.snyk-policy.outputs.available == 'true'
        working-directory: frontend
        run: npm ci

      - name: Snyk frontend scan
        if: steps.snyk-policy.outputs.available == 'true'
        working-directory: frontend
        run: snyk test --file=package-lock.json --package-manager=npm --severity-threshold=high
