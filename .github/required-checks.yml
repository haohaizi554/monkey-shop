# Required branch-protection contract for MonkeyShop.
# Configure these as required status checks on the protected main branch.
branch: main
require_pull_request_before_merging: true
required_secrets:
  - NVD_API_KEY
  - SNYK_TOKEN
  - SONAR_TOKEN
required_variables:
  - SONAR_HOST_URL
  - SONAR_PROJECT_KEY
  - SONAR_ORGANIZATION
required_status_checks:
  - Maven Verify
  - Frontend Verify
  - DevOps Manifest Verify
  - Image Build Scan Sign
  - Fast WS1 Security Gate
  - Full OWASP Dependency Check
  - CodeQL Analyze (java-kotlin)
  - CodeQL Analyze (javascript-typescript)
  - Snyk Dependency Scan
  - SonarQube Quality Gate
release_blockers:
  - name: Secret History Rewrite Attestation
    runbook: docs/security/ws1-history-cleanup.md
    evidence:
      - target/ws1-security/gitleaks-history.json
      - credential rotation ticket references
