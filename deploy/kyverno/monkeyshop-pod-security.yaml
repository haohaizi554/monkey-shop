apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: monkeyshop-pod-security
  annotations:
    policies.kyverno.io/title: MonkeyShop restricted pod baseline
    policies.kyverno.io/category: Pod Security
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-non-root-readonly-runtime
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - monkeyshop-*
      validate:
        message: MonkeyShop pods must run as non-root with read-only root filesystems and dropped capabilities.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  capabilities:
                    drop:
                      - ALL
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  capabilities:
                    drop:
                      - ALL
    - name: require-resource-requests-and-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - monkeyshop-*
      validate:
        message: MonkeyShop containers must declare CPU and memory requests and limits.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
