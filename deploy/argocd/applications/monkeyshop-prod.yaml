apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monkeyshop-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monkeyshop
    app.kubernetes.io/environment: prod
spec:
  project: default
  source:
    repoURL: https://github.com/haohaizi554/monkey-shop.git
    # Bootstrap fail-closed pin. CI replaces this with the release commit that contains the signed image digest.
    targetRevision: 62dbf68f2a3d9be9d5bb1c25d81d342acc1dfb57
    path: helm/monkeyshop
    helm:
      releaseName: monkeyshop
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monkeyshop-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

