apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monkeyshop-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monkeyshop
    app.kubernetes.io/environment: prod
spec:
  project: default
  source:
    repoURL: https://github.com/haohaizi554/monkey-shop.git
    targetRevision: HEAD
    path: helm/monkeyshop
    helm:
      releaseName: monkeyshop
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monkeyshop-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

