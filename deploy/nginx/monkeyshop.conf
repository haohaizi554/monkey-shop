upstream monkeyshop_app {
    server monkey-app:8888;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name monkeyshop.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://monkeyshop.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name monkeyshop.example.com;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        proxy_pass http://monkeyshop_app;
        proxy_http_version 1.1;
        proxy_set_header Host monkeyshop.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host monkeyshop.example.com;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
