spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

logging:
  level:
    org.hibernate.SQL: WARN

app:
  upload:
    virus-scan:
      enabled: ${APP_UPLOAD_VIRUS_SCAN_ENABLED:true}
      host: ${CLAMAV_HOST:clamav}
      port: ${CLAMAV_PORT:3310}
      timeout-millis: ${CLAMAV_TIMEOUT_MILLIS:5000}
