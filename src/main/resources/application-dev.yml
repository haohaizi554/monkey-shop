spring:
  datasource:
    # Local MySQL often uses a self-signed TLS cert; dev still requires encrypted transport.
    url: ${DB_URL:jdbc:mysql://localhost:3306/monkeyshop_dev?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&sslMode=REQUIRED&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:monkeyuser}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}

monkeyshop:
  rate-limit:
    register:
      edge-capacity: ${MONKEYSHOP_RATE_LIMIT_REGISTER_EDGE_CAPACITY:120}
      edge-window: ${MONKEYSHOP_RATE_LIMIT_REGISTER_EDGE_WINDOW:1h}
      identity-capacity: ${MONKEYSHOP_RATE_LIMIT_REGISTER_IDENTITY_CAPACITY:120}
      identity-window: ${MONKEYSHOP_RATE_LIMIT_REGISTER_IDENTITY_WINDOW:1h}

app:
  security:
    client-ip:
      trusted-proxy-cidrs: ${APP_SECURITY_TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
    csp:
      upgrade-insecure-requests: ${APP_SECURITY_CSP_UPGRADE_INSECURE_REQUESTS:false}
  auth:
    require-redis-state: ${APP_AUTH_REQUIRE_REDIS_STATE:false}
    captcha:
      provider: ${APP_AUTH_CAPTCHA_PROVIDER:local}
      cookie-secure: ${APP_AUTH_CAPTCHA_COOKIE_SECURE:${SESSION_COOKIE_SECURE:false}}
    password-reset:
      delivery-mode: ${APP_PASSWORD_RESET_DELIVERY_MODE:logging}
  jwt:
    cookie-secure: ${APP_JWT_COOKIE_SECURE:${SESSION_COOKIE_SECURE:false}}
    allow-generated-secret: ${APP_JWT_ALLOW_GENERATED_SECRET:true}
    require-redis-token-store: ${APP_JWT_REQUIRE_REDIS_TOKEN_STORE:false}
  pii:
    encryption:
      enabled: ${APP_PII_ENCRYPTION_ENABLED:true}
      allow-plaintext-read: ${APP_PII_ALLOW_PLAINTEXT_READ:false}
  logistics:
    webhook-secret: ${APP_LOGISTICS_WEBHOOK_SECRET:${random.uuid}}
  payment:
    callback-secret: ${APP_PAYMENT_CALLBACK_SECRET:${random.uuid}}

logging:
  level:
    org.hibernate.SQL: WARN
