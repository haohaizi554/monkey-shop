<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人中心 | Monkey Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" integrity="sha384-QuGBSgV5Im3DzL2z+8Ko9/hqNy/N0O7zwvXAtfd1MvPKWa/UbeLV65cfm4BV5Wgq" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>

<div id="app">
    <!-- 1. 全局 Toast 容器 -->
    <div class="toast-container">
        <div v-for="toast in toasts" :key="toast.id" :class="['custom-toast', {error: toast.type === 'error'}]">
            <i :class="toast.type === 'error' ? 'bi bi-x-circle-fill text-danger' : 'bi bi-check-circle-fill text-primary'"></i>
            <div>
                <div class="fw-bold">{{ toast.title }}</div>
                <div class="small text-muted">{{ toast.msg }}</div>
            </div>
        </div>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/shop.html"><i class="bi bi-box-seam-fill me-2"></i>MonkeyShop</a>
            <div class="d-flex align-items-center">
                <a href="/shop.html" class="btn btn-outline-secondary btn-sm rounded-pill"><i class="bi bi-arrow-left me-1"></i> 返回商城</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row g-4">
            <!-- 左侧菜单 -->
            <div class="col-md-3">
                <div class="card sidebar-card">
                    <div class="card-body text-center py-4 bg-white">
                        <img :src="user.avatar || '/images/default_avatar.png'" class="avatar-lg mb-3" v-fallback-img="'/images/default_avatar.png'">
                        <h5 class="fw-bold">{{ user.username }}</h5>
                        <p class="text-muted small mb-0">{{ user.maskedPhone }}</p>
                    </div>
                    <div class="list-group list-group-flush">
                        <a class="list-group-item" :class="{active: currentTab==='info'}" @click="currentTab='info'">
                            <i class="bi bi-person-badge me-2"></i> 个人资料
                        </a>
                        <a class="list-group-item" :class="{active: currentTab==='address'}" @click="currentTab='address'">
                            <i class="bi bi-geo-alt me-2"></i> 收货地址
                        </a>
                        <a class="list-group-item" :class="{active: currentTab==='security'}" @click="currentTab='security'">
                            <i class="bi bi-shield-lock me-2"></i> 账号安全
                        </a>
                    </div>
                </div>
            </div>

            <!-- 右侧内容 -->
            <div class="col-md-9">
                <div class="card content-card">
                    <div class="card-body p-4">

                        <!-- 面板 1: 个人资料 -->
                        <div v-if="currentTab==='info'">
                            <h4 class="mb-4 fw-bold">个人资料</h4>
                            <div class="row align-items-center">
                                <div class="col-md-3 text-center">
                                    <img :src="user.avatar || '/images/default_avatar.png'" class="avatar-lg mb-3" v-fallback-img="'/images/default_avatar.png'">
                                    <div class="position-relative overflow-hidden btn btn-sm btn-outline-primary rounded-pill">
                                        更换头像
                                        <input type="file" class="avatar-file-input" @change="handleAvatarUpload">
                                    </div>
                                </div>
                                <div class="col-md-9">
                                    <div class="mb-3">
                                        <label class="form-label text-muted">用户名</label>
                                        <input type="text" class="form-control" :value="user.username" disabled>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-muted">绑定手机</label>
                                        <input type="text" class="form-control" :value="user.maskedPhone" disabled>
                                        <div class="form-text">如需修改手机号请前往账号安全</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 面板 2: 收货地址 -->
                        <div v-if="currentTab==='address'">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h4 class="fw-bold mb-0">收货地址</h4>
                                <button class="btn btn-primary btn-sm rounded-pill" @click="showAddAddressModal">
                                    <i class="bi bi-plus-lg"></i> 新增地址
                                </button>
                            </div>

                            <div v-if="addresses.length === 0" class="text-center text-muted py-5">
                                <i class="bi bi-inbox display-4"></i>
                                <p class="mt-3">暂无收货地址</p>
                            </div>

                            <div v-for="addr in addresses" :key="addr.id" :class="['address-item', {default: addr.isDefault}]">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h6 class="fw-bold mb-1">
                                            {{ addr.receiverName }}
                                            <span class="text-muted fw-normal ms-2">{{ addr.phone }}</span>
                                            <span v-if="addr.isDefault" class="tag-default">默认</span>
                                        </h6>
                                        <p class="mb-0 text-secondary small">{{ addr.detailAddress }}</p>
                                    </div>
                                    <div class="d-flex align-items-center gap-2">
                                        <button v-if="!addr.isDefault" @click="setAsDefault(addr.id)" class="btn btn-link btn-sm text-decoration-none p-0">设为默认</button>
                                        <!-- 修改：点击删除不再弹原生 confirm，而是打开模态框 -->
                                        <button @click="openDeleteModal(addr.id)" class="btn btn-link btn-sm text-danger text-decoration-none p-0"><i class="bi bi-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 面板 3: 账号安全 -->
                        <div v-if="currentTab==='security'">
                            <h4 class="mb-4 fw-bold">修改密码</h4>
                            <div class="alert alert-light border small text-muted mb-4">
                                <i class="bi bi-info-circle me-2"></i> 为了您的账号安全，修改密码需要验证绑定的手机号。
                            </div>

                            <div class="row">
                                <div class="col-md-8">
                                    <form @submit.prevent="updatePassword">
                                        <div class="mb-3">
                                            <label class="form-label">完整手机号</label>
                                            <input type="text" class="form-control" v-model="security.phone" placeholder="请输入注册时绑定的手机号">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">验证码</label>
                                            <div class="d-flex gap-2">
                                                <input type="text" class="form-control" v-model="security.captcha" placeholder="右侧字符">
                                                <img :src="captchaUrl" class="captcha-img" @click="refreshCaptcha" title="点击刷新">
                                            </div>
                                        </div>
                                        <div class="mb-4">
                                            <label class="form-label">新密码</label>
                                            <input type="password" class="form-control" v-model="security.newPassword" placeholder="设置新密码">
                                        </div>
                                        <button type="submit" class="btn btn-primary rounded-pill px-4">确认修改</button>
                                    </form>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 新增地址弹窗 -->
    <div class="modal fade" id="addressModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">新增收货地址</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">收货人</label>
                        <input type="text" class="form-control" v-model="newAddr.receiverName">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">手机号</label>
                        <input type="text" class="form-control" v-model="newAddr.phone">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">详细地址</label>
                        <textarea class="form-control" v-model="newAddr.detailAddress" rows="3"></textarea>
                    </div>
                    <button class="btn btn-primary w-100 rounded-pill" @click="saveAddress">保存地址</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 删除确认弹窗 (替代 confirm) -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-3">
                <div class="modal-body">
                    <i class="bi bi-exclamation-circle text-warning display-4 mb-3 d-block"></i>
                    <h5 class="fw-bold">确定删除吗？</h5>
                    <p class="text-muted small">删除后无法恢复</p>
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <button class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">取消</button>
                        <button class="btn btn-danger rounded-pill px-4" @click="confirmDelete">删除</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.24/dist/vue.global.prod.js" integrity="sha384-p6n0UPgWa805beutC9KJNaH/mexY+ABykG5NWhUHHRg/YkgnVJ3sDkrwaVJHNtPw" crossorigin="anonymous"></script>

<script src="/js/monkeyshop-shared.js"></script>

<script src="/js/profile.js"></script>
</body>
</html>
