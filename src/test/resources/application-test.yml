spring:
  datasource:
    url: jdbc:h2:mem:monkeyshop-commerce;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  test:
    database:
      replace: none

app:
  pii:
    encryption:
      enabled: false
