# Slice tests boot the default prod profile. Supply the secrets prod refuses to invent,
# without opening API docs or publishing Redis/MySQL.
APP_JWT_ALLOW_GENERATED_SECRET=true
APP_JWT_REQUIRE_REDIS_TOKEN_STORE=false
APP_AUTH_REQUIRE_REDIS_STATE=false
APP_RATE_LIMIT_REQUIRE_REDIS_STATE=false
APP_CART_REQUIRE_REDIS_STATE=false
APP_RISK_REQUIRE_REDIS_STATE=false
APP_LOGISTICS_WEBHOOK_SECRET=test-logistics-webhook-secret
APP_PAYMENT_CALLBACK_SECRET=test-payment-callback-secret
DB_URL=jdbc:h2:mem:monkeyshop-slice;MODE=MySQL;DB_CLOSE_DELAY=-1
DB_USERNAME=sa
DB_PASSWORD=test
