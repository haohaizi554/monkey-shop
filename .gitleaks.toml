title = "MonkeyShop gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore generated and local runtime artifacts"
paths = [
    '''^target/''',
    '''^uploads/''',
    '''^frontend/node_modules/''',
    '''^frontend/dist/''',
    '''^frontend/dist-ssr/''',
    '''^frontend/test-results/''',
    '''^frontend/playwright-report/''',
    '''^frontend/coverage/''',
    '''^frontend/lighthouse-report\.json$''',
    '''^\.trae/''',
]
