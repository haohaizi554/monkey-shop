global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: monkeyshop
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:8888']

  - job_name: otel-collector
    static_configs:
      - targets: ['127.0.0.1:8889']

  - job_name: loki
    static_configs:
      - targets: ['127.0.0.1:3100']

  - job_name: tempo
    static_configs:
      - targets: ['127.0.0.1:3200']
