{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "monkeyshop.fullname" . }}
  labels:
    {{- include "monkeyshop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "monkeyshop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  strategy:
    canary:
      steps:
        {{- toYaml .Values.rollout.steps | nindent 8 }}
  template:
    {{- include "monkeyshop.podTemplate" . | nindent 4 }}
{{- end }}

