{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: monkeyshop-http-5xx-rate
  labels:
    {{- include "monkeyshop.labels" . | nindent 4 }}
spec:
  args:
    - name: service-name
  metrics:
    - name: http-5xx-rate
      interval: 1m
      count: 5
      successCondition: result[0] < {{ .Values.rollout.analysis.maxFiveXxRate }}
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress | quote }}
          query: |
            sum(rate(http_server_requests_seconds_count{status=~"5..",service="{{`{{args.service-name}}`}}"}[1m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{service="{{`{{args.service-name}}`}}"}[1m])), 1)
{{- end }}

