{{- if .Values.prometheusRule.enabled }}
{{- $fullname := include "monkeyshop.fullname" . -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}
  {{- if .Values.prometheusRule.namespace }}
  namespace: {{ .Values.prometheusRule.namespace }}
  {{- end }}
  labels:
    {{- include "monkeyshop.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: monkeyshop.slo
      rules:
        - alert: MonkeyShopHighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{service="{{ $fullname }}",status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{service="{{ $fullname }}"}[5m])), 1)
            ) > {{ .Values.prometheusRule.thresholds.errorRate }}
          for: {{ .Values.prometheusRule.for.errorRate }}
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: MonkeyShop HTTP 5xx rate is above the SLO budget
            description: More than {{ .Values.prometheusRule.thresholds.errorRate }} of requests are returning 5xx responses for {{ $fullname }}.
            runbook_url: {{ .Values.prometheusRule.runbookUrl | quote }}
        - alert: MonkeyShopSloFastBurn
          expr: |
            (
              (
                sum(rate(http_server_requests_seconds_count{service="{{ $fullname }}",status=~"5.."}[5m]))
                /
                clamp_min(sum(rate(http_server_requests_seconds_count{service="{{ $fullname }}"}[5m])), 1)
              ) > ({{ .Values.prometheusRule.slo.errorBudgetRatio }} * {{ .Values.prometheusRule.slo.burnRates.fast }})
            )
            and
            (
              (
                sum(rate(http_server_requests_seconds_count{service="{{ $fullname }}",status=~"5.."}[1h]))
                /
                clamp_min(sum(rate(http_server_requests_seconds_count{service="{{ $fullname }}"}[1h])), 1)
              ) > ({{ .Values.prometheusRule.slo.errorBudgetRatio }} * {{ .Values.prometheusRule.slo.burnRates.fast }})
            )
          for: {{ .Values.prometheusRule.for.sloFastBurn }}
          labels:
            severity: critical
            slo: availability
            target: {{ .Values.prometheusRule.slo.targetAvailability | quote }}
          annotations:
            summary: MonkeyShop 99.9% availability SLO fast burn
            description: The 5m and 1h HTTP 5xx ratios are burning the {{ .Values.prometheusRule.slo.window }} availability error budget faster than {{ .Values.prometheusRule.slo.burnRates.fast }}x.
            runbook_url: {{ .Values.prometheusRule.runbookUrl | quote }}
        - alert: MonkeyShopSloSlowBurn
          expr: |
            (
              (
                sum(rate(http_server_requests_seconds_count{service="{{ $fullname }}",status=~"5.."}[30m]))
                /
                clamp_min(sum(rate(http_server_requests_seconds_count{service="{{ $fullname }}"}[30m])), 1)
              ) > ({{ .Values.prometheusRule.slo.errorBudgetRatio }} * {{ .Values.prometheusRule.slo.burnRates.slow }})
            )
            and
            (
              (
                sum(rate(http_server_requests_seconds_count{service="{{ $fullname }}",status=~"5.."}[6h]))
                /
                clamp_min(sum(rate(http_server_requests_seconds_count{service="{{ $fullname }}"}[6h])), 1)
              ) > ({{ .Values.prometheusRule.slo.errorBudgetRatio }} * {{ .Values.prometheusRule.slo.burnRates.slow }})
            )
          for: {{ .Values.prometheusRule.for.sloSlowBurn }}
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
            slo: availability
            target: {{ .Values.prometheusRule.slo.targetAvailability | quote }}
          annotations:
            summary: MonkeyShop 99.9% availability SLO slow burn
            description: The 30m and 6h HTTP 5xx ratios are burning the {{ .Values.prometheusRule.slo.window }} availability error budget faster than {{ .Values.prometheusRule.slo.burnRates.slow }}x.
            runbook_url: {{ .Values.prometheusRule.runbookUrl | quote }}
        - alert: MonkeyShopP99LatencyHigh
          expr: |
            histogram_quantile(
              0.99,
              sum by (le) (rate(http_server_requests_seconds_bucket{service="{{ $fullname }}"}[5m]))
            ) > {{ .Values.prometheusRule.thresholds.p99LatencySeconds }}
          for: {{ .Values.prometheusRule.for.p99Latency }}
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: MonkeyShop p99 HTTP latency is high
            description: The p99 HTTP latency for {{ $fullname }} is above {{ .Values.prometheusRule.thresholds.p99LatencySeconds }} seconds.
            runbook_url: {{ .Values.prometheusRule.runbookUrl | quote }}
        - alert: MonkeyShopHikariPoolSaturation
          expr: |
            (
              max(hikaricp_connections_active{service="{{ $fullname }}"})
              /
              clamp_min(max(hikaricp_connections_max{service="{{ $fullname }}"}), 1)
            ) > {{ .Values.prometheusRule.thresholds.hikariSaturation }}
          for: {{ .Values.prometheusRule.for.hikariSaturation }}
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: MonkeyShop HikariCP pool is close to saturation
            description: Active database connections are above {{ .Values.prometheusRule.thresholds.hikariSaturation }} of the configured pool maximum.
            runbook_url: {{ .Values.prometheusRule.runbookUrl | quote }}
        - alert: MonkeyShopDown
          expr: absent(up{service="{{ $fullname }}"} == 1)
          for: {{ .Values.prometheusRule.for.appDown }}
          labels:
            severity: critical
          annotations:
            summary: MonkeyShop scrape target is down
            description: Prometheus has no healthy scrape target for {{ $fullname }}.
            runbook_url: {{ .Values.prometheusRule.runbookUrl | quote }}
        - alert: MonkeyShopStockDeductFailures
          expr: |
            sum(increase(stock_deduct_fail_total{service="{{ $fullname }}"}[5m])) > {{ .Values.prometheusRule.thresholds.stockDeductFailures }}
          for: {{ .Values.prometheusRule.for.stockDeductFailures }}
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: MonkeyShop stock deduction failures are elevated
            description: Stock deduction failures exceeded {{ .Values.prometheusRule.thresholds.stockDeductFailures }} attempts in five minutes.
            runbook_url: {{ .Values.prometheusRule.runbookUrl | quote }}
        - alert: MonkeyShopPendingOrdersBacklog
          expr: |
            max(order_pending{service="{{ $fullname }}"}) > {{ .Values.prometheusRule.thresholds.pendingOrders }}
          for: {{ .Values.prometheusRule.for.pendingOrders }}
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: MonkeyShop pending order backlog is high
            description: Paid but unshipped orders are above {{ .Values.prometheusRule.thresholds.pendingOrders }}.
            runbook_url: {{ .Values.prometheusRule.runbookUrl | quote }}
        - alert: MonkeyShopRiskHighScoreSpike
          expr: |
            sum(increase(risk_high_score_total{service="{{ $fullname }}"}[5m])) > {{ .Values.prometheusRule.thresholds.riskHighScores }}
          for: {{ .Values.prometheusRule.for.riskHighScores }}
          labels:
            severity: {{ .Values.prometheusRule.severity | quote }}
          annotations:
            summary: MonkeyShop high-risk decisions are elevated
            description: Risk scores at or above 80 exceeded {{ .Values.prometheusRule.thresholds.riskHighScores }} decisions in five minutes.
            runbook_url: {{ .Values.prometheusRule.runbookUrl | quote }}
        - alert: MonkeyShopRiskPriceAnomaly
          expr: |
            sum(increase(risk_price_anomaly_total{service="{{ $fullname }}"}[5m])) > {{ .Values.prometheusRule.thresholds.riskPriceAnomalies }}
          for: {{ .Values.prometheusRule.for.riskPriceAnomalies }}
          labels:
            severity: critical
          annotations:
            summary: MonkeyShop risk price anomalies triggered auto-unlist
            description: Price anomaly risk controls auto-unlisted more than {{ .Values.prometheusRule.thresholds.riskPriceAnomalies }} products in five minutes.
            runbook_url: {{ .Values.prometheusRule.runbookUrl | quote }}
        - alert: MonkeyShopRiskAccountBlocks
          expr: |
            sum(increase(risk_blocked_total{service="{{ $fullname }}"}[5m])) > {{ .Values.prometheusRule.thresholds.riskAccountBlocks }}
          for: {{ .Values.prometheusRule.for.riskAccountBlocks }}
          labels:
            severity: critical
          annotations:
            summary: MonkeyShop risk controls blocked accounts
            description: Risk controls revoked tokens for more than {{ .Values.prometheusRule.thresholds.riskAccountBlocks }} accounts in five minutes.
            runbook_url: {{ .Values.prometheusRule.runbookUrl | quote }}
{{- end }}
