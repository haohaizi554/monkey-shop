{{- if .Values.grafanaDashboard.enabled }}
{{- $fullname := include "monkeyshop.fullname" . -}}
{{- $namespace := include "monkeyshop.namespaceName" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-grafana-dashboard
  {{- if .Values.grafanaDashboard.namespace }}
  namespace: {{ .Values.grafanaDashboard.namespace }}
  {{- end }}
  labels:
    {{- include "monkeyshop.labels" . | nindent 4 }}
    {{ .Values.grafanaDashboard.sidecarLabel }}: {{ .Values.grafanaDashboard.sidecarLabelValue | quote }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  monkeyshop-observability.json: |-
    {
      "uid": "monkeyshop-observability",
      "title": "MonkeyShop Observability",
      "tags": ["monkeyshop", "spring-boot", "slo"],
      "links": [
        {
          "title": "Audit trace API",
          "type": "link",
          "url": "/api/stats/audit-trace?traceId=${traceId}",
          "targetBlank": true
        }
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "{{ .Values.grafanaDashboard.datasource.prometheusUid }}",
              "value": "{{ .Values.grafanaDashboard.datasource.prometheusUid }}"
            }
          },
          {
            "name": "loki",
            "type": "datasource",
            "query": "loki",
            "current": {
              "text": "{{ .Values.grafanaDashboard.datasource.lokiUid }}",
              "value": "{{ .Values.grafanaDashboard.datasource.lokiUid }}"
            }
          },
          {
            "name": "tempo",
            "type": "datasource",
            "query": "tempo",
            "current": {
              "text": "{{ .Values.grafanaDashboard.datasource.tempoUid }}",
              "value": "{{ .Values.grafanaDashboard.datasource.tempoUid }}"
            }
          },
          {
            "name": "service",
            "type": "constant",
            "query": "{{ $fullname }}",
            "current": {
              "text": "{{ $fullname }}",
              "value": "{{ $fullname }}"
            }
          },
          {
            "name": "namespace",
            "type": "constant",
            "query": "{{ $namespace }}",
            "current": {
              "text": "{{ $namespace }}",
              "value": "{{ $namespace }}"
            }
          },
          {
            "name": "traceId",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP RPS",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{service=\"$service\"}[$__rate_interval]))",
              "legendFormat": "requests/sec",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP P99 Latency",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{service=\"$service\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HTTP 5xx Error Rate",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{service=\"$service\",status=~\"5..\"}[$__rate_interval])) / clamp_min(sum(rate(http_server_requests_seconds_count{service=\"$service\"}[$__rate_interval])), 1)",
              "legendFormat": "5xx ratio",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit" },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HikariCP Saturation",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "max(hikaricp_connections_active{service=\"$service\"}) / clamp_min(max(hikaricp_connections_max{service=\"$service\"}), 1)",
              "legendFormat": "active/max",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit" },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "JVM Memory",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum by (area) (jvm_memory_used_bytes{service=\"$service\"}) / clamp_min(sum by (area) (jvm_memory_max_bytes{service=\"$service\"}), 1)",
              "legendFormat": "memory area",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit" },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Orders Created",
          "gridPos": { "h": 8, "w": 4, "x": 8, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(increase(order_created_total{service=\"$service\"}[$__range]))",
              "legendFormat": "orders",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Stock Deduct Failures",
          "gridPos": { "h": 8, "w": 4, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(increase(stock_deduct_fail_total{service=\"$service\"}[$__range]))",
              "legendFormat": "failures",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Order Create P99",
          "gridPos": { "h": 8, "w": 4, "x": 16, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(order_create_seconds_bucket{service=\"$service\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Pending Orders",
          "gridPos": { "h": 8, "w": 4, "x": 20, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "max(order_pending{service=\"$service\"})",
              "legendFormat": "pending",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Audit Events By TraceId",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "loki", "uid": "${loki}" },
          "targets": [
            {
              "expr": "{namespace=\"$namespace\"} |= \"$traceId\" |= \"audit\"",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "type": "traces",
          "title": "Tempo Trace Drilldown",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "tempo", "uid": "${tempo}" },
          "targets": [
            {
              "query": "$traceId",
              "queryType": "traceql",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "type": "stat",
          "title": "SLO Availability 30d",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "1 - (sum(increase(http_server_requests_seconds_count{service=\"$service\",status=~\"5..\"}[30d])) / clamp_min(sum(increase(http_server_requests_seconds_count{service=\"$service\"}[30d])), 1))",
              "legendFormat": "availability",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "green", "value": {{ .Values.prometheusRule.slo.targetAvailability }} }] } },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Error Budget Burn Rate",
          "gridPos": { "h": 8, "w": 16, "x": 8, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "(sum(rate(http_server_requests_seconds_count{service=\"$service\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{service=\"$service\"}[5m])), 1)) / {{ .Values.prometheusRule.slo.errorBudgetRatio }}",
              "legendFormat": "5m burn rate",
              "refId": "A"
            },
            {
              "expr": "(sum(rate(http_server_requests_seconds_count{service=\"$service\",status=~\"5..\"}[1h])) / clamp_min(sum(rate(http_server_requests_seconds_count{service=\"$service\"}[1h])), 1)) / {{ .Values.prometheusRule.slo.errorBudgetRatio }}",
              "legendFormat": "1h burn rate",
              "refId": "B"
            }
          ]
        }
      ]
    }
{{- end }}
