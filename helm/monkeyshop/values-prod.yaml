global:
  environment: prod

namespace:
  create: true
  name: monkeyshop-prod

image:
  repository: ghcr.io/haohaizi554/monkey-shop
  tag: prod
  # CI/CD writes the signed release digest here before production sync.
  digest: sha256:8d0dc3905bde643a73cc4b74b749ab821d5c42ff392095c5a211f48b0f51eafe
  pullPolicy: IfNotPresent

replicaCount: 3

config:
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: jdbc:mysql://monkeyshop-mysql.monkeyshop-prod.svc.cluster.local:3306/monkeyshop?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=true&requireSSL=true&verifyServerCertificate=true
  DB_USERNAME: monkeyuser
  SPRING_DATA_REDIS_HOST: monkeyshop-redis.monkeyshop-prod.svc.cluster.local
  APP_TURNSTILE_EXPECTED_HOSTNAME: monkeyshop.example.com
  APP_PII_VAULT_ADDR: https://vault.prod.example.com
  APP_PII_VAULT_TRANSIT_KEY: monkeyshop-pii-prod
  CLAMAV_HOST: clamav.monkeyshop-security.svc.cluster.local
  APP_STORAGE_PROVIDER: minio
  APP_STORAGE_MINIO_BUCKET: monkeyshop-prod
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  SENTRY_ENVIRONMENT: prod
  SENTRY_TRACES_SAMPLE_RATE: "0.05"

externalSecret:
  enabled: true

externalServices:
  enabled: true
  services:
    mysql:
      enabled: true
      name: monkeyshop-mysql
      externalName: prod-mysql.internal
      port: 3306
    redis:
      enabled: true
      name: monkeyshop-redis
      externalName: prod-redis.internal
      port: 6379

initContainers:
  waitForMysql:
    image: busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028

ingress:
  enabled: true
  hosts:
    - host: monkeyshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: monkeyshop-prod-tls
      hosts:
        - monkeyshop.example.com

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

rollout:
  enabled: true

serviceMonitor:
  enabled: true

prometheusRule:
  enabled: true

grafanaDashboard:
  enabled: true
