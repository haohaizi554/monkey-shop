services:
  # --- MySQL 数据库服务 ---
  mysql:
    image: mysql:8.0
    container_name: monkey-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: monkeyshop
      MYSQL_USER: ${MYSQL_USER:-monkey}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-monkey123}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # --- Java 应用服务 ---
  myshop:
    build: .
    container_name: monkey-app
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/monkeyshop?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-monkey}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-monkey123}
      SERVER_PORT: 8888
      SPRING_JPA_SHOW_SQL: "false"
      APP_UPLOAD_PATH: /data/images/
      TZ: Asia/Shanghai
    volumes:
      - ./uploads:/data/images

volumes:
  mysql_data:
